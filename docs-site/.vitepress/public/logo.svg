<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#d4a012"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0f14" stroke="#1e2832" stroke-width="1"/>
  <!-- Chart bars (upward trend) -->
  <rect x="12" y="38" width="6" height="12" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="22" y="30" width="6" height="20" rx="1" fill="url(#gold)" opacity="0.8"/>
  <rect x="32" y="24" width="6" height="26" rx="1" fill="url(#gold)"/>
  <rect x="42" y="16" width="6" height="34" rx="1" fill="url(#green)"/>
  <!-- Trend line -->
  <path d="M15 40 L25 32 L35 26 L45 18" stroke="url(#green)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Dollar sign overlay -->
  <text x="32" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f0b429" text-anchor="middle" dominant-baseline="middle">$</text>
</svg>
